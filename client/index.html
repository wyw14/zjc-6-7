<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻牌配对小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🃏 翻牌配对小游戏</h1>
    
    <div class="mode-selector">
      <label for="gameMode">游戏模式：</label>
      <select id="gameMode" class="mode-select">
        <option value="normal">🎮 普通模式 (8对)</option>
        <option value="hard">🔥 困难模式 (12对)</option>
        <option value="daily">📅 每日挑战</option>
      </select>
    </div>

    <div class="game-info">
      <div class="info-item">
        <span class="label">⏱️ 用时</span>
        <span id="timer" class="value">00:00</span>
      </div>
      <div class="info-item">
        <span class="label">👆 步数</span>
        <span id="moves" class="value">0</span>
      </div>
      <div class="info-item">
        <span class="label">✅ 已配对</span>
        <span id="matched" class="value">0/8</span>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="controls">
      <button id="restartBtn" class="btn btn-primary">🔄 重新开始</button>
      <button id="leaderboardBtn" class="btn btn-secondary">🏆 排行榜</button>
      <button id="profileBtn" class="btn btn-secondary">👤 个人档案</button>
    </div>

    <div id="winModal" class="modal hidden">
      <div class="modal-content">
        <h2>🎉 恭喜通关！</h2>
        <p>游戏模式：<span id="finalMode">普通模式</span></p>
        <p>你的成绩：<span id="finalTime">00:00</span></p>
        <p>总步数：<span id="finalMoves">0</span></p>
        <p>排名：<span id="finalRank">--</span></p>
        <div id="newAchievements" class="achievements-section hidden">
          <h3>🏅 解锁新成就</h3>
          <div id="newAchievementsList" class="achievements-list"></div>
        </div>
        <div class="input-group">
          <label for="playerName">输入你的名字：</label>
          <input type="text" id="playerName" placeholder="匿名玩家" maxlength="10">
        </div>
        <button id="submitScoreBtn" class="btn btn-primary">提交成绩</button>
        <button id="playAgainBtn" class="btn btn-secondary">再玩一次</button>
      </div>
    </div>

    <div id="leaderboardModal" class="modal hidden">
      <div class="modal-content">
        <h2>🏆 排行榜</h2>
        <div class="mode-selector">
          <label for="leaderboardMode">查看：</label>
          <select id="leaderboardMode" class="mode-select">
            <option value="normal">🎮 普通模式</option>
            <option value="hard">🔥 困难模式</option>
            <option value="daily">📅 每日挑战</option>
          </select>
        </div>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
        <button id="closeLeaderboardBtn" class="btn btn-secondary">关闭</button>
      </div>
    </div>

    <div id="profileModal" class="modal hidden">
      <div class="modal-content profile-content">
        <h2>👤 个人档案</h2>
        <div class="input-group">
          <label for="profilePlayerName">玩家名称：</label>
          <input type="text" id="profilePlayerName" placeholder="输入玩家名" maxlength="10">
          <button id="searchProfileBtn" class="btn btn-primary" style="margin-top: 10px;">查询</button>
        </div>
        <div id="profileStats" class="profile-stats hidden">
          <h3>📊 游戏统计</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">总场次</span>
              <span id="statTotalGames" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">困难场次</span>
              <span id="statHardGames" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">连续打卡</span>
              <span id="statDailyStreak" class="stat-value">0天</span>
            </div>
          </div>
          <h3 style="margin-top: 15px;">🎯 最佳记录</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">普通最佳</span>
              <span id="statBestNormal" class="stat-value">--</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">困难最佳</span>
              <span id="statBestHard" class="stat-value">--</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">每日最佳</span>
              <span id="statBestDaily" class="stat-value">--</span>
            </div>
          </div>
        </div>
        <div id="profileAchievements" class="achievements-section hidden">
          <h3>🏅 成就收藏 <span id="achievementCount" class="achievement-count"></span></h3>
          <div id="profileAchievementsList" class="achievements-list"></div>
        </div>
        <button id="closeProfileBtn" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
